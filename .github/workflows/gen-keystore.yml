name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
          KS_KEY_PASSWORD: ${{ secrets.KS_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          keytool -genkeypair -v -keystore release.jks \
            -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KS_ALIAS" -storepass "$KS_PASSWORD" -keypass "$KS_KEY_PASSWORD" \
            -dname "CN=TV777, OU=Mobile, O=TV777, L=Riyadh, ST=Riyadh, C=SA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.jks
          if-no-files-found: error
